[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "aurival"
version = "0.1.3"
description = "Write a bot for Aurival. Declare commands, call run(), we handle the rest."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Nullspire LLC" }]
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
keywords = ["aurival", "bot", "chat"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
]

# Two, and both earn their place — see README.md "Dependencies".
dependencies = ["aiohttp==3.14.3", "cryptography==50.0.1"]

[project.urls]
Homepage = "https://bots.aurival.com/docs"
Repository = "https://github.com/Nullspire-LLC/aurival-sdk"
Issues = "https://github.com/Nullspire-LLC/aurival-sdk/issues"

[project.optional-dependencies]
dev = ["pytest==9.1.1", "pytest-asyncio==1.4.0", "ruff==0.16.6"]

[project.scripts]
aurival = "aurival.cli:main"

[tool.setuptools.packages.find]
include = ["aurival*"]

[tool.ruff]
line-length = 100
target-version = "py310"
# Markdown is prose. ruff would reformat the README's code blocks and pull the
# quick-start away from the shape PLAN.md sets.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
